# Reverse proxy in front of the API (compose service "proxy").
# It is the only published port: the api container is reachable only through it.
# Mounted as /etc/nginx/conf.d/default.conf, which nginx includes inside http {}.

# 10 requests/second per client IP, bursts of 30; beyond that the client gets 429.
limit_req_zone $binary_remote_addr zone=perip:10m rate=10r/s;
limit_req_status 429;

server {
    listen 80;
    server_tokens off;

    # A little above UPLOAD_MAX_BYTES (10 MB) so the app's own 413 message wins for
    # files just over the limit, while anything much bigger is stopped here.
    client_max_body_size 12m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    location / {
        limit_req zone=perip burst=30 nodelay;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Wikidata lookups and spreadsheet jobs can take a while.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
