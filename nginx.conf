# Reverse proxy in front of the API (compose service "proxy").
# It is the only published port: the api container is reachable only through it.
# Mounted as /etc/nginx/conf.d/default.conf, which nginx includes inside http {}.
#
# Not run against a live host yet. Check `docker compose exec proxy nginx -t` and
# the smoke tests in the README after the first start.

# Per client IP. The app has its own per-client limits too (RATE_LIMIT_*); these
# stop floods before they reach Python. The page polls status ~2.5 times a second.
limit_req_zone $binary_remote_addr zone=perip:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=upload:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=connperip:10m;
limit_req_status 429;
limit_conn_status 429;

server {
    listen 80;
    server_tokens off;

    # A little above UPLOAD_MAX_BYTES (10 MB) so the app's own 413 message wins for
    # files just over the limit, while anything much bigger is stopped here.
    client_max_body_size 12m;
    # Slow-body and slow-header clients are dropped instead of holding a worker.
    client_body_timeout 30s;
    client_header_timeout 15s;
    send_timeout 60s;
    limit_conn connperip 20;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    # Operators read /metrics from inside the network (docker compose exec api ...),
    # never from the internet.
    location = /metrics {
        return 404;
    }

    # JSON endpoints never need more than the app's MAX_BODY_BYTES.
    location ~ ^/(resolve|resolve/batch)$ {
        client_max_body_size 512k;
        limit_req zone=perip burst=30 nodelay;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, never append: a client-supplied X-Forwarded-For would otherwise
        # reach the app, whose rate limiter and logs trust the first address in it.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        # Wikidata lookups and spreadsheet jobs can take a while.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location = /upload {
        limit_req zone=upload burst=5 nodelay;
        # Let the app stream the body to disk instead of nginx buffering all 10 MB.
        proxy_request_buffering off;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, never append: a client-supplied X-Forwarded-For would otherwise
        # reach the app, whose rate limiter and logs trust the first address in it.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        # Wikidata lookups and spreadsheet jobs can take a while.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        limit_req zone=perip burst=30 nodelay;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, never append: a client-supplied X-Forwarded-For would otherwise
        # reach the app, whose rate limiter and logs trust the first address in it.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        # Wikidata lookups and spreadsheet jobs can take a while.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
