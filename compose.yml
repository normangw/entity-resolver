# Entity Resolver stack.
# Two services: the API and a Caddy reverse proxy in front of it. Only the proxy
# publishes ports (80 and 443, TCP); the API is reachable only through it. There is
# no database, vector store or cache. Set SITE_ADDRESS in .env to the instance's DNS
# name for HTTPS; unset, the proxy serves plain HTTP on port 80.
# The opt-in `observability` profile adds Prometheus (internal only) and Grafana
# (published only on host loopback):  docker compose --profile observability up -d
# Start everything on a fresh clone with:  docker compose up -d
# (pulls the published :main image, or builds it; add --build to run your tree).
# To make /health report the deployed commit:
#   BUILD_ID=$(git rev-parse --short HEAD) docker compose up -d --build
# On the server, deploy a published image instead of building one:
#   scripts/deploy.sh 0.2.0        (and scripts/deploy.sh --previous to roll back)
#
# NOTE: the resource limits, cap_drop and healthchecks below have not been run on a
# live host; check `docker compose ps` shows both services healthy after the first
# start, and `docker compose logs api` for permission errors on /data/uploads.

services:
  api:
    # The image CI tested and published. VERSION is a release (0.2.0), a commit sha
    # or main; scripts/deploy.sh sets it. `--build` builds from source instead, for
    # local development.
    image: ghcr.io/normangw/entity-resolver:${VERSION:-main}
    build:
      context: .
      args:
        BUILD_ID: ${BUILD_ID:-unknown}
    # Settings come in at run time, never baked into the image.
    # .env is optional: without it the defaults in config.py apply, including the
    # bundled 5-company seed index. On the server .env sets
    #   ALIAS_INDEX_PATH=/data/index/companies.full.json
    # after scripts/load_index.sh has put the full index into the volume below.
    env_file:
      - path: .env
        required: false
    # Not published: only the proxy below can reach it, on the compose network.
    expose:
      - "8000"
    volumes:
      # The full alias index, loaded by scripts/load_index.sh; outside the image so
      # a deploy or rollback never touches it.
      - alias-index:/data/index
      # Upload jobs (files, state, answers) survive a restart for UPLOAD_TTL_SECONDS.
      - uploads:/data/uploads
    restart: unless-stopped
    # Let uvicorn drain requests and the app save running jobs (see the Dockerfile).
    stop_grace_period: 30s
    # The index and RapidFuzz need well under 1 GB; cap it so a leak cannot take the
    # host down. Two CPUs bound a runaway scoring loop.
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  proxy:
    # Pinned by digest (the multi-arch index of caddy:2.11.8-alpine). To update:
    # docker buildx imagetools inspect caddy:<version>-alpine
    image: caddy:2.11.8-alpine@sha256:f6228111e5fafa1a5238258d0858e103f10599b8d1659a146e7726681a002bb9
    ports:
      # TCP only: HTTP/3 (UDP 443) is turned off in the Caddyfile.
      - "80:80/tcp"
      - "443:443/tcp"
    environment:
      # Read from .env by compose. Unset = plain HTTP on :80 (local runs).
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      ACME_CA: ${ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and the ACME account. Keep it: a fresh one asks Let's Encrypt
      # again, and too many asks hit its rate limit.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 128m
    cpus: 1.0
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE  # ports 80 and 443
    healthcheck:
      # busybox wget ships with the alpine image. http://127.0.0.1 is the on-host
      # site in the Caddyfile, so this checks Caddy and the api behind it.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  prometheus:
    image: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=35d
      - --storage.tsdb.retention.size=1GB
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    secrets:
      - metrics_token
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  grafana:
    image: grafana/grafana:12.4@sha256:982fa6bf18cc38280a30bf08c3b673486067d4805b25a9d4756688a689a993c7
    profiles: [observability]
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    secrets:
      - grafana_admin_password
    volumes:
      - grafana-data:/var/lib/grafana
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  # Holds companies.full.json. Empty until scripts/load_index.sh fills it; the app
  # reads it only when .env points ALIAS_INDEX_PATH there.
  alias-index:
  uploads:
  # Caddy's certificates, keys and ACME account (/data) and its saved config.
  caddy-data:
  caddy-config:
  prometheus-data:
  grafana-data:

# Keep real secrets outside the repository and the Docker build context.
secrets:
  metrics_token:
    file: ${OBSERVABILITY_SECRET_DIR:-../entity-resolver-observability-secrets}/metrics-token
  grafana_admin_password:
    file: ${OBSERVABILITY_SECRET_DIR:-../entity-resolver-observability-secrets}/grafana-admin-password
