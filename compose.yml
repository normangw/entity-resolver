# Entity Resolver stack.
# Two services: the API and an nginx reverse proxy in front of it. The proxy is the
# only published port (80); the API is reachable only through it. There is no
# database, vector store or cache.
# Start everything on a fresh clone with:  docker compose up -d

services:
  api:
    build: .
    image: entity-resolver:latest
    # Settings come in at run time, never baked into the image.
    # .env is optional: without it the defaults in config.py apply.
    env_file:
      - path: .env
        required: false
    environment:
      # The alias index lives in the named volume so it survives the container.
      ALIAS_INDEX_PATH: /app/src/entity_resolver/data/companies.json
    # Not published: only the proxy below can reach it, on the compose network.
    expose:
      - "8000"
    volumes:
      - alias-index:/app/src/entity_resolver/data
    restart: unless-stopped

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  # Seeded from the image on first start. After changing companies.json in the
  # repo, run `docker compose down -v && docker compose up -d --build` to reseed.
  alias-index:
