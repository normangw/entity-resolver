# Entity Resolver stack.
# API and reverse proxy, plus an opt-in observability profile.
# Prometheus is internal; Grafana is published only on host loopback.
# Start everything on a fresh clone with:  docker compose up -d
# To make /health report the deployed commit:
#   BUILD_ID=$(git rev-parse --short HEAD) docker compose up -d --build
#
# NOTE: the resource limits, cap_drop and healthchecks below have not been run on a
# live host; check `docker compose ps` shows both services healthy after the first
# start, and `docker compose logs api` for permission errors on /data/uploads.

services:
  api:
    build:
      context: .
      args:
        BUILD_ID: ${BUILD_ID:-unknown}
    image: entity-resolver:latest
    # Settings come in at run time, never baked into the image.
    # .env is optional: without it the defaults in config.py apply.
    env_file:
      - path: .env
        required: false
    environment:
      # The alias index lives in the named volume so it survives the container.
      ALIAS_INDEX_PATH: /app/src/entity_resolver/data/companies.json
    # Not published: only the proxy below can reach it, on the compose network.
    expose:
      - "8000"
    volumes:
      - alias-index:/app/src/entity_resolver/data
      # Upload jobs (files, state, answers) survive a restart for UPLOAD_TTL_SECONDS.
      - uploads:/data/uploads
    restart: unless-stopped
    # Let uvicorn drain requests and the app save running jobs (see the Dockerfile).
    stop_grace_period: 30s
    # The index and RapidFuzz need well under 1 GB; cap it so a leak cannot take the
    # host down. Two CPUs bound a runaway scoring loop.
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 128m
    cpus: 1.0
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # busybox wget ships with the alpine image.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  prometheus:
    image: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=35d
      - --storage.tsdb.retention.size=1GB
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    secrets:
      - metrics_token
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  grafana:
    image: grafana/grafana:12.4@sha256:982fa6bf18cc38280a30bf08c3b673486067d4805b25a9d4756688a689a993c7
    profiles: [observability]
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    secrets:
      - grafana_admin_password
    volumes:
      - grafana-data:/var/lib/grafana
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  # Seeded from the image on first start. After changing companies.json in the
  # repo, run `docker compose down -v && docker compose up -d --build` to reseed.
  alias-index:
  uploads:
  prometheus-data:
  grafana-data:

# Keep real secrets outside the repository and the Docker build context.
secrets:
  metrics_token:
    file: ${OBSERVABILITY_SECRET_DIR:-../entity-resolver-observability-secrets}/metrics-token
  grafana_admin_password:
    file: ${OBSERVABILITY_SECRET_DIR:-../entity-resolver-observability-secrets}/grafana-admin-password
